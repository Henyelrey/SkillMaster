spring.application.name=skillmaster

# --- Seguridad / OAuth2 (JWT) ---
# Clave HMAC para firmar los access tokens (mínimo 32 caracteres).
# En producción defínela con la variable de entorno JWT_SECRET; el valor por defecto es solo para desarrollo.
skillmaster.jwt.secret=${JWT_SECRET:dev-only-secret-cambiar-en-produccion-0123456789}
skillmaster.jwt.expiracion-segundos=3600
